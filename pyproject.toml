[project]
name = "insurance-semantic-workbench"
version = "0.1.0"
description = "A local, evidence-grounded semantic workbench for fictional insurance claims"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Nick Petrushin"}]
dependencies = [
  "fastapi==0.143.0", "pydantic==2.14.1", "pydantic-settings==2.15.0",
  "uvicorn==0.54.0", "jinja2==3.1.6", "python-multipart==0.0.32",
  "rdflib==7.6.0", "pyshacl==0.40.1", "owlrl==7.6.2",
  "sqlalchemy==2.1.4", "alembic==1.20.0", "psycopg[binary]==3.3.6",
  "pgvector==0.5.1", "sentence-transformers==6.1.0", "torch==2.14.1",
  "openai-codex==0.162.1", "mcp==2.3.0", "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-playwright==0.10.0", "playwright==1.63.0", "ruff==0.17.0"]

[project.scripts]
isw = "insurance_workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_workbench"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
markers = ["live_codex: explicit subscription-backed live assistant workflow"]
addopts = "-ra"
